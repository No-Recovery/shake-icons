name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - site/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Публикация
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Исходники
        uses: actions/checkout@v4

      - name: Настройка Pages
        uses: actions/configure-pages@v5

      - name: Загрузка сайта
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Публикация
        id: deployment
        uses: actions/deployment-pages@v4