name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - site/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Публикация
    runs-on: ubuntu-latest
    steps:
      - name: Исходники
        uses: actions/checkout@v4

      # Собираем содержимое site/ в корень ветки gh-pages, не трогая исходный checkout.
      - name: Сборка ветки gh-pages
        run: |
          set -eu
          build="$(mktemp -d)"
          cp -r site/. "$build/"
          cd "$build"
          git init -q .
          git config user.name  'github-pages'
          git config user.email 'github-pages@users.noreply.github.com'
          git add -A
          tree="$(git write-tree)"
          commit="$(git commit-tree "$tree" -m 'Публикация сайта')"
          git push --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "${commit}:refs/heads/gh-pages"