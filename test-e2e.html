<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Сквозная проверка compose.js</title>
<link rel="stylesheet" href="site/styles.css">
<style>
  body { font: 13px ui-monospace, Menlo, Consolas, monospace; background: #030712; color: #eee; }
  pre { white-space: pre-wrap; }
  /*Результат не должен влиять на раскладку экрана*/
  #out { position: fixed; left: 0; top: 0; z-index: 99; margin: 0; }
  .hide { display: none; }
</style>
</head>
<body class="page-compose">
<pre id="out">запуск…</pre>

<!-- Экран во всю страницу: раскладка должна быть настоящей -->
<div class="stage">
  <div class="stage__inner">
    <canvas class="screen" id="screen"></canvas>
  </div>
</div>

<!-- Остальное ожидает compose.js и не влияет на размеры экрана -->
<div class="hide">
  <span id="statIcons">—</span>
  <span id="statState">—</span>
  <span id="tilt"></span>
  <span id="hint"></span>
  <button id="gyro"></button>
  <button id="reset"></button>
  <div id="loader"></div>
  <pre id="fatal" hidden></pre>
</div>

<!-- Настоящая разметка страницы: снимок один и занимает её целиком -->

<script src="site/lib.js"></script>
<script src="testdata.js"></script>
<script>
/* Заглушки: отдаём синтетическую пару напрямую, без IndexedDB */
'use strict';
location.hash = '#e2e';
const PAIR = tdMakePair();
function idbGet() {
  return Promise.resolve({ clean: PAIR.clean, icons: PAIR.withIcons, at: 0 });
}
function loadBitmap(src) {
  return Promise.resolve(src);
}
</script>
<script src="site/compose.js"></script>
<script>
'use strict';

const log = [];
let fails = 0;
let done = false;

function check(name, ok, detail) {
  if (!ok) fails++;
  log.push((ok ? 'ok   ' : 'FAIL ') + name + (detail ? '  [' + detail + ']' : ''));
  paint();
}

function paint() {
  /* Пока прогон не закончен, PASS писать нельзя: проверки идут с await,
     и промежуточное состояние выглядело бы как успех. */
  const verdict = done
    ? (fails === 0 ? 'RESULT: PASS' : 'RESULT: FAIL (' + fails + ')')
    : 'RESULT: выполняется, проверок: ' + log.filter(l => /^(ok|FAIL)/.test(l)).length;

  window.__text = log.join('\n') + '\n\n' + verdict;
  document.getElementById('out').textContent = window.__text;
  document.documentElement.dataset.result = done ? (fails === 0 ? 'pass' : 'fail') : 'running';
}

/* Стенд читает результат из POST /__result */
function report() {
  try {
    fetch('/__result', { method: 'POST', body: window.__text || '' });
  } catch (e) { /* стенд разберётся по таймауту */ }
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

/* Прокручиваем физику детерминированно: rAF в headless тикает нестабильно,
   а frame() — это лишь цикл step() + render(). */
function advance(seconds, dt) {
  dt = dt || 1 / 60;
  const n = Math.round(seconds / dt);
  for (let i = 0; i < n; i++) { step(dt); render(); }
}

function meanDiff(a, b) {
  if (a.data.length !== b.data.length) return 1e9;
  let sum = 0;
  for (let i = 0; i < a.data.length; i += 4) {
    sum += Math.abs(a.data[i] - b.data[i])
         + Math.abs(a.data[i + 1] - b.data[i + 1])
         + Math.abs(a.data[i + 2] - b.data[i + 2]);
  }
  return sum / (a.data.length / 4) / 3;
}

async function run() {
  /* ждём, пока main() соберёт сцену */
  const stat = document.getElementById('statIcons');
  for (let i = 0; i < 60 && stat.textContent === '—'; i++) await sleep(50);
  await sleep(150);

  const fatal = document.getElementById('fatal');
  check('без экрана ошибки', fatal.hidden === true,
        'fatal="' + fatal.textContent + '" | ' +
        (document.documentElement.dataset.jsError || '').slice(0, 300));

  const analysis = analysisSize(PAIR.clean);
  check('найдено 16 иконок', stat.textContent === String(PAIR.expected.length),
        'найдено ' + stat.textContent);

  const screen = document.getElementById('screen');
  check('канва в масштабе анализа',
        screen.width === analysis.w && screen.height === analysis.h,
        screen.width + 'x' + screen.height + ', ожидалось ' + analysis.w + 'x' + analysis.h);

  /* Снимок должен занимать весь экран, а не сидеть в рамке с полями */
  const stage = document.querySelector('.stage');
  const sr = screen.getBoundingClientRect();
  const gr = stage.getBoundingClientRect();
  check('канва во всю ширину экрана',
        Math.abs(sr.width - gr.width) < 2, sr.width.toFixed(0) + ' из ' + gr.width.toFixed(0));
  check('канва во всю высоту экрана',
        Math.abs(sr.height - gr.height) < 2, sr.height.toFixed(0) + ' из ' + gr.height.toFixed(0));
  check('пропорции снимка сохранены при заполнении экрана',
        getComputedStyle(screen).objectFit === 'cover',
        getComputedStyle(screen).objectFit);
  check('вокруг снимка нет отступов',
        getComputedStyle(stage).padding === '0px',
        getComputedStyle(stage).padding);

  /* эталон: чистый экран + нарисованные иконки */
  const ref = document.createElement('canvas');
  ref.width = analysis.w;
  ref.height = analysis.h;
  const rc = ref.getContext('2d', { willReadFrequently: true });
  rc.drawImage(PAIR.clean, 0, 0, analysis.w, analysis.h);
  rc.drawImage(PAIR.withIcons, 0, 0, analysis.w, analysis.h);
  const refData = rc.getImageData(0, 0, analysis.w, analysis.h);

  const shot = () => screen.getContext('2d').getImageData(0, 0, screen.width, screen.height);

  /* Участок фона, свободный от иконок: по нему видно, что сам кадр
     не сдвигается и не вздрагивает. */
  /* Полоса фона выше всех иконок. Обе пробы снимаются одним и тем же
     render(), поэтому сравнение ловит только сдвиг кадра, а не разницу
     масштабирования: иконки туда не залетают — они только падают вниз. */
  const topHome = icons.reduce((m, i) => Math.min(m, i.homeY), Infinity);
  const bgRows = Math.max(2, Math.floor(topHome / 3));

  const bgProbe = () => {
    const all = screen.getContext('2d').getImageData(0, 0, screen.width, screen.height);
    const scale = screen.width / analysis.w;
    const want = Math.max(1, Math.round(bgRows * scale));
    const band = document.createElement('canvas');
    band.width = all.width;
    band.height = want;
    band.getContext('2d').putImageData(all, 0, 0, 0, 0, all.width, want, 0, 0);

    const out = document.createElement('canvas');
    out.width = analysis.w;
    out.height = bgRows;
    const ox = out.getContext('2d', { willReadFrequently: true });
    ox.drawImage(band, 0, 0, out.width, out.height);
    return ox.getImageData(0, 0, analysis.w, bgRows);
  };

  const d0 = meanDiff(shot(), refData);
  check('в покое совпадает с эталоном', d0 < 12, 'средняя разница ' + d0.toFixed(2));

  /* Панели сверху и снизу убраны: на странице должен быть только снимок */
  check('верхней панели нет', !document.querySelector('.topbar'),
        'topbar=' + !!document.querySelector('.topbar'));
  check('нижней панели нет', !document.querySelector('.hud'),
        'hud=' + !!document.querySelector('.hud'));
  check('страница не прокручивается',
        getComputedStyle(document.body).overflow === 'hidden',
        getComputedStyle(document.body).overflow);

  /* Пока телефон плашмя и не трясут — иконки на местах */
  advance(0.5);
  check('без тряски иконки держат места',
        icons.every(i => !i.free) &&
        document.getElementById('statState').textContent === 'на местах',
        document.getElementById('statState').textContent);

  /* Тряска телефона отпускает иконки: onOrientation ловит резкий поворот */
  onOrientation({ beta: 5, gamma: 0 });
  onOrientation({ beta: 30, gamma: 25 });
  const st = document.getElementById('statState').textContent;
  check('тряска телефона отпускает иконки', /в движении 16/.test(st), st);

  /* иконки двигаются и не совпадают с эталоном */
  beta = 60;
  advance(0.6);
  const d1 = meanDiff(shot(), refData);
  check('после тряски иконки двинулись', d1 > d0 + 0.5,
        'было ' + d0.toFixed(2) + ', стало ' + d1.toFixed(2));
  beta = 0;

  /* смещение должно быть вниз: телефон наклонён вперёд (beta > 0) */
  reset();
  beta = 60;
  release(24);
  advance(0.6);
  const moved = icons.filter(i => i.free);
  const down = moved.filter(i => i.y > i.homeY).length;
  check('иконки падают вниз при наклоне',
        moved.length > 0 && down >= moved.length * 0.8,
        'вниз ' + down + ' из ' + moved.length);
  beta = 0;

  /* гравитация по горизонтали: при gamma > 0 иконки уходят вправо */
  reset();
  gamma = 45;
  release(24);
  advance(0.6);
  const right = icons.filter(i => i.free && i.x > i.homeX).length;
  check('при наклоне вправо иконки идут вправо',
        right >= icons.length * 0.8, 'вправо ' + right + ' из ' + icons.length);
  gamma = 0;

  /* Покой должен быть настоящим: осевший штабель лежит на месте столько,
     сколько нужно, и никуда сам не собирается — сборка только по тапу. */
  reset();
  beta = 70;
  release(24);
  advance(20);
  const lyingHome = icons.filter(i => !i.free).length;
  const lyingFree = icons.filter(i => i.free).length;
  check('осевший штабель остаётся лежать, а не собирается сам',
        lyingFree > 0, 'собралось ' + lyingHome + ', лежит ' + lyingFree);
  beta = 0;

  /* Никакой тряски экрана: полоса фона выше иконок не должна сдвинуться
     за все кадры, пока иконки бьются о низ */
  reset();
  advance(0.1);
  const bgBefore = bgProbe();
  beta = 70;
  release(24);
  let bgWorst = 0;
  for (let i = 0; i < 180; i++) { step(1 / 60); render(); bgWorst = Math.max(bgWorst, meanDiff(bgProbe(), bgBefore)); }
  check('фон не трясётся при ударах иконок', bgWorst < 0.5,
        'максимальный сдвиг ' + bgWorst.toFixed(3));
  beta = 0;

  /* Иконка ложится на иконку, а не проходит сквозь неё */
  reset();
  beta = 70;
  release(24);
  advance(6);

  let worst = 0;
  for (let i = 0; i < icons.length; i++) {
    for (let j = i + 1; j < icons.length; j++) {
      const a = icons[i];
      const b = icons[j];
      if (!a.free || !b.free) continue;
      const ox = Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x);
      const oy = Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y);
      const ov = Math.min(ox, oy);
      if (ov > worst) worst = ov;
    }
  }
  check('иконки ложатся друг на друга, не проходят сквозь', worst < 6,
        'наибольшее наложение ' + worst.toFixed(1) + ' px');

  /* Штабель: иконки лежат друг на друге, поэтому «у нижнего края» окажутся
     не все — проверяем, что они успокоились и собрались ниже середины. */
  const atRest = icons.filter(i => Math.hypot(i.vx, i.vy) < 1).length;
  const belowMid = icons.filter(i => i.y + i.h / 2 > H / 2).length;
  check('иконки успокоились и осели вниз',
        atRest === icons.length && belowMid >= icons.length * 0.6,
        'покоя ' + atRest + ' из ' + icons.length +
        ', ниже середины ' + belowMid + ' из ' + icons.length);

  /* и штабель сложен ровно: верхний ряд стоит вплотную на нижнем */
  let gap = 0;
  for (let i = 0; i < icons.length; i++) {
    for (let j = 0; j < icons.length; j++) {
      if (i === j) continue;
      const a = icons[i];
      const b = icons[j];
      const ox = Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x);
      if (ox <= 0) continue;
      const dy = (b.y + b.h / 2) - (a.y + a.h / 2);
      if (dy <= 0) continue;
      const gapPx = b.y - (a.y + a.h);
      if (gapPx > -1 && gapPx < gap + 1) gap = Math.max(gap, gapPx);
    }
  }
  check('штабель без щелей', gap <= 1, 'худшая щель ' + gap.toFixed(1) + ' px');
  beta = 0;

  /* Меню настроек убрано */
  const knob = document.getElementById('knob');
  const panel = document.getElementById('panel');
  check('меню настроек удалено', !knob && !panel,
        'knob=' + !!knob + ' panel=' + !!panel);

  /* В ролике иконки крутятся в полёте, но коротко: это поворот, не юла.
     Поэтому вращение есть, но суммарный поворот не превышает maxTurn. */
  reset();
  beta = 70;
  release(24);
  let spunFrames = 0;
  let turnSeen = 0;
  for (let i = 0; i < 240; i++) {
    step(1 / 60);
    for (const ic of icons) {
      if (ic.vrot) spunFrames++;
      if (Math.abs(ic.rot) > turnSeen) turnSeen = Math.abs(ic.rot);
    }
  }
  check('иконки слегка крутятся в полёте',
        spunFrames > 40 && turnSeen > 0.4,
        'кадров с вращением ' + spunFrames + ', поворот до ' + turnSeen.toFixed(2) + ' рад');
  check('вращение ограничено, иконки не юлят',
        turnSeen <= maxTurn + 1e-6,
        'поворот ' + turnSeen.toFixed(2) + ' при пределе ' + maxTurn);
  beta = 0;

  /* Иконки должны реально лететь, а не мгновенно замирать на месте */
  reset();
  beta = 70;
  release(24);
  let peakSpeed = 0;
  let flying = 0;
  for (let i = 0; i < 90; i++) {
    step(1 / 60);
    for (const ic of icons) {
      const s = Math.hypot(ic.vx, ic.vy);
      if (s > peakSpeed) peakSpeed = s;
      if (s > 60) flying++;
    }
  }
  check('иконки разлетаются и летят, а не стоят', peakSpeed > 200 && flying > 20,
        'пиковая скорость ' + peakSpeed.toFixed(0) + ' px/с, летели ' + flying + ' кадров');
  beta = 0;

  /* небольшой наклон всё ещё сдвигает иконки */
  reset();
  gamma = 12;
  release(24);
  advance(1.5);
  check('слабый наклон тоже сдвигает иконки',
        icons.filter(i => i.free && i.x > i.homeX).length >= icons.length * 0.8,
        'вправо ' + icons.filter(i => i.free && i.x > i.homeX).length + ' из ' + icons.length);
  gamma = 0;

  /* Края экрана срезают иконки: в ролике они выезжают за край наполовину,
     но совсем не исчезают */
  reset();
  beta = 20;
  gamma = 60;
  release(40);
  let clipped = 0;
  let vanished = 0;
  for (let i = 0; i < 300; i++) {
    step(1 / 60);
    for (const ic of icons) {
      if (ic.x + ic.w < 0 || ic.x > W || ic.y + ic.h < 0 || ic.y > H) vanished++;
      else if (ic.x < 0 || ic.x + ic.w > W) clipped++;
    }
  }
  check('иконки обрезаются краем экрана, но не улетают',
        clipped > 0 && vanished === 0,
        'кадров за краем ' + clipped + ', улетело ' + vanished);
  beta = 0;
  gamma = 0;

  /* Тап по экрану собирает иконки обратно на места */
  reset();
  beta = 70;
  release(24);
  advance(1);
  const flyingNow = icons.filter(i => i.free).length;
  try {
    screen.dispatchEvent(new PointerEvent('pointerdown', { pointerId: 1, bubbles: true }));
  } catch (e) { /* синтетическое событие без настоящего указателя */ }
  advance(RETURN_TIME + 0.2);
  check('тап по экрану собирает иконки на места',
        flyingNow > 0 && icons.every(i =>
          !i.free && i.x === i.homeX && i.y === i.homeY && i.rot === 0),
        'в движении было ' + flyingNow + ', осталось ' + icons.filter(i => i.free).length);
  beta = 0;

  /* Возврат не телепорт: иконка летит на место около RETURN_TIME */
  reset();
  beta = 70;
  release(24);
  advance(1);
  home();
  advance(RETURN_TIME * 0.25);
  const stillAway = icons.filter(i => i.free).length;
  const notYetHome = icons.filter(i => Math.hypot(i.x - i.homeX, i.y - i.homeY) > 1).length;
  check('возврат плавный, а не телепорт',
        stillAway === icons.length && notYetHome > 0,
        'в пути ' + stillAway + ', ещё не на месте ' + notYetHome);
  advance(RETURN_TIME + 0.2);
  check('после плавного возврата все на местах',
        icons.every(i => !i.free), icons.filter(i => i.free).length + ' в движении');
  beta = 0;

  /* возврат на места */
  reset();
  advance(0.1);
  check('кнопка возврата работает',
        document.getElementById('statState').textContent === 'на местах',
        document.getElementById('statState').textContent);

  const d2 = meanDiff(shot(), refData);
  check('после возврата снова эталон', d2 < 12, 'средняя разница ' + d2.toFixed(2));

  /* Иконки не улетают за экран целиком */
  reset();
  beta = 20;
  gamma = 60;
  release(40);
  let gone = 0;
  for (let i = 0; i < 300; i++) {
    step(1 / 60);
    for (const ic of icons) {
      if (ic.x + ic.w < 0 || ic.x > W || ic.y + ic.h < 0 || ic.y > H) gone++;
    }
  }
  check('иконки не улетают за экран', gone === 0, 'улетело ' + gone);
  beta = 0;
  gamma = 0;
}

run()
  .catch(err => { check('исключение', false, err.message); })
  .then(() => { done = true; paint(); report(); });
</script>
</body>
</html>
